spring.application.name=pedidos-api

# Base de datos: MySQL. Los valores salen de variables de entorno (ver docker-compose.yml).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pedidos}
spring.datasource.username=${DB_USER:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos}

# El esquema lo maneja Flyway; Hibernate solo valida que las entidades coincidan con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health

# JWT: el secreto es obligatorio y llega por variable de entorno (mínimo 32 caracteres).
jwt.secret=${JWT_SECRET}
jwt.expiracion-horas=8

# Administrador inicial (opcional): se crea al arrancar si se definen las dos variables.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# IA (opcional): sugerencias de sobrantes con Claude. Requiere ANTHROPIC_API_KEY.
app.ia.habilitada=${IA_HABILITADA:false}
app.ia.modelo=claude-opus-5-5
